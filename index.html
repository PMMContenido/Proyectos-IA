<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creador de Apps HTML No Code</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #151c33;
      --panel-soft: #1d2747;
      --text: #eaf0ff;
      --text-soft: #afbddb;
      --accent: #66d9ef;
      --accent-2: #7cf29a;
      --danger: #ff7b8a;
      --border: #2d3a63;
      --shadow: 0 20px 45px rgba(3, 6, 15, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top right, #172144 0%, var(--bg) 55%);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      line-height: 1.5;
      padding: 24px;
    }

    .app {
      max-width: 1240px;
      margin: 0 auto;
      display: grid;
      gap: 20px;
      grid-template-columns: minmax(320px, 440px) minmax(0, 1fr);
    }

    .card {
      background: linear-gradient(140deg, var(--panel), var(--panel-soft));
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 20px;
    }

    h1 { font-size: clamp(1.5rem, 3vw, 2rem); margin-bottom: 6px; }
    h2 { font-size: 1.1rem; margin-bottom: 10px; color: var(--accent); }

    .subtitle { color: var(--text-soft); margin-bottom: 18px; }

    label { display: block; font-size: 0.92rem; margin-bottom: 8px; color: var(--text-soft); }

    textarea, input, select {
      width: 100%;
      border: 1px solid var(--border);
      background: rgba(8, 12, 26, 0.7);
      color: var(--text);
      border-radius: 12px;
      padding: 11px 12px;
      font: inherit;
      margin-bottom: 14px;
    }

    textarea { min-height: 160px; resize: vertical; }

    .row { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }

    .btns { display: flex; flex-wrap: wrap; gap: 10px; }

    button {
      cursor: pointer;
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 0.9rem;
      transition: transform .2s ease, opacity .2s ease;
    }

    button:hover { transform: translateY(-1px); }

    .primary { background: linear-gradient(90deg, var(--accent), #7daeff); color: #08142d; }
    .secondary { background: #2b3a64; color: var(--text); }
    .danger { background: #402038; color: var(--danger); }

    .status {
      margin-top: 10px;
      font-size: 0.88rem;
      color: var(--accent-2);
      min-height: 1.3em;
    }

    .preview-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    pre {
      background: rgba(5, 8, 18, 0.85);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      overflow: auto;
      max-height: 60vh;
      font-size: 0.84rem;
      white-space: pre;
    }

    iframe {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
      min-height: 360px;
      margin-top: 12px;
    }

    .hint { color: var(--text-soft); font-size: .84rem; margin-top: 4px; }

    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      pre { max-height: 44vh; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card" aria-label="Generador">
      <h1>Creador de Apps HTML No Code</h1>
      <p class="subtitle">Describe tu idea en lenguaje natural y genera una app en <strong>un solo archivo HTML</strong>.</p>

      <label for="idea">Descripción de la app</label>
      <textarea id="idea" placeholder="Ejemplo: Crea un gestor de tareas con prioridades, filtros y guardado en localStorage."></textarea>

      <div class="row">
        <div>
          <label for="style">Estilo visual</label>
          <select id="style">
            <option value="moderno">Moderno</option>
            <option value="minimalista">Minimalista</option>
            <option value="oscuro">Oscuro</option>
            <option value="colorido">Colorido</option>
          </select>
        </div>
        <div>
          <label for="complexity">Complejidad</label>
          <select id="complexity">
            <option value="base">Base</option>
            <option value="intermedia" selected>Intermedia</option>
            <option value="avanzada">Avanzada</option>
          </select>
        </div>
      </div>

      <label for="extras">Funciones adicionales (opcional)</label>
      <input id="extras" placeholder="Validaciones, animaciones, localStorage, API fetch, etc." />

      <div class="btns">
        <button id="generateBtn" class="primary">Generar app</button>
        <button id="copyBtn" class="secondary">Copiar código</button>
        <button id="downloadBtn" class="secondary">Descargar app.html</button>
        <button id="resetBtn" class="danger">Limpiar</button>
      </div>
      <p class="status" id="status"></p>
      <p class="hint">Tip: la salida incluye estructura HTML, CSS responsive y JavaScript vanilla listos para usar.</p>
    </section>

    <section class="card" aria-label="Resultado">
      <div class="preview-head">
        <h2>Archivo generado: app.html</h2>
      </div>
      <pre id="codeOutput" aria-live="polite"></pre>
      <iframe id="appPreview" title="Vista previa de app generada"></iframe>
    </section>
  </main>

  <script>
    const ideaEl = document.getElementById('idea');
    const styleEl = document.getElementById('style');
    const complexityEl = document.getElementById('complexity');
    const extrasEl = document.getElementById('extras');
    const codeOutput = document.getElementById('codeOutput');
    const preview = document.getElementById('appPreview');
    const statusEl = document.getElementById('status');

    const generateBtn = document.getElementById('generateBtn');
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const resetBtn = document.getElementById('resetBtn');

    function escapeHtml(str) {
      return str.replace(/[&<>\"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
    }

    function buildFeatureList(inputText, extrasText) {
      const map = [
        ['form', 'Formulario con validación básica'],
        ['localstorage', 'Persistencia de datos en localStorage'],
        ['api', 'Consumo de datos usando Fetch API'],
        ['gráfico', 'Visualización de datos'],
        ['canvas', 'Interacciones con Canvas'],
        ['drag', 'Interacción drag & drop']
      ];

      const source = `${inputText} ${extrasText}`.toLowerCase();
      const features = map.filter(([key]) => source.includes(key)).map(([, feature]) => feature);
      return features.length ? features : ['Interfaz responsive moderna', 'Eventos DOM y feedback visual'];
    }

    function generateAppHtml() {
      const idea = ideaEl.value.trim();
      if (!idea) {
        statusEl.textContent = 'Por favor describe primero tu idea.';
        statusEl.style.color = 'var(--danger)';
        return '';
      }

      const style = styleEl.value;
      const complexity = complexityEl.value;
      const extras = extrasEl.value.trim();
      const features = buildFeatureList(idea, extras);
      const palette = {
        moderno: ['#1f3a8a', '#2563eb', '#eff6ff', '#0f172a'],
        minimalista: ['#334155', '#64748b', '#f8fafc', '#0f172a'],
        oscuro: ['#0f172a', '#1e293b', '#111827', '#e2e8f0'],
        colorido: ['#7c3aed', '#f43f5e', '#fff7ed', '#1f2937']
      }[style];

      const baseSections = complexity === 'base' ? 2 : complexity === 'intermedia' ? 3 : 5;

      const generated = `<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App generada desde prompt</title>
  <style>
    :root { --c1: ${palette[0]}; --c2: ${palette[1]}; --bg: ${palette[2]}; --text: ${palette[3]}; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
    .hero { background: linear-gradient(120deg, var(--c1), var(--c2)); color: white; border-radius: 16px; padding: 24px; }
    .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-top: 18px; }
    .card { background: white; color: #111827; border-radius: 12px; padding: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    @media (max-width: 720px) { .hero { padding: 18px; } }
  </style>
</head>
<body>
  <main class="container">
    <section class="hero">
      <h1>Propuesta de app</h1>
      <p><strong>Idea:</strong> ${escapeHtml(idea)}</p>
      <p><strong>Extras:</strong> ${escapeHtml(extras || 'No especificados')}</p>
    </section>

    <section class="grid">
      ${Array.from({ length: baseSections }).map((_, idx) => `<article class="card"><h2>Bloque ${idx + 1}</h2><p>Sección funcional para organizar contenido e interacciones.</p></article>`).join('\n      ')}
    </section>
  </main>

  <script>
    // Features detectadas del prompt:
    const features = ${JSON.stringify(features)};
    console.log('Funciones sugeridas:', features);
  <\/script>
</body>
</html>`;

      codeOutput.textContent = generated;
      preview.srcdoc = generated;
      statusEl.textContent = 'App generada correctamente.';
      statusEl.style.color = 'var(--accent-2)';
      return generated;
    }

    generateBtn.addEventListener('click', generateAppHtml);

    copyBtn.addEventListener('click', async () => {
      if (!codeOutput.textContent.trim()) {
        statusEl.textContent = 'Genera una app antes de copiar.';
        statusEl.style.color = 'var(--danger)';
        return;
      }
      await navigator.clipboard.writeText(codeOutput.textContent);
      statusEl.textContent = 'Código copiado al portapapeles.';
      statusEl.style.color = 'var(--accent-2)';
    });

    downloadBtn.addEventListener('click', () => {
      if (!codeOutput.textContent.trim()) {
        statusEl.textContent = 'No hay archivo para descargar aún.';
        statusEl.style.color = 'var(--danger)';
        return;
      }
      const blob = new Blob([codeOutput.textContent], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'app.html';
      a.click();
      URL.revokeObjectURL(url);
      statusEl.textContent = 'Descarga iniciada.';
      statusEl.style.color = 'var(--accent-2)';
    });

    resetBtn.addEventListener('click', () => {
      ideaEl.value = '';
      extrasEl.value = '';
      codeOutput.textContent = '';
      preview.srcdoc = '';
      statusEl.textContent = 'Formulario limpiado.';
      statusEl.style.color = 'var(--text-soft)';
    });

    ideaEl.value = 'Crea una app de gastos personales con categorías, filtros y resumen mensual.';
    extrasEl.value = 'localStorage, formularios, validaciones';
    generateAppHtml();
  </script>
</body>
</html>
